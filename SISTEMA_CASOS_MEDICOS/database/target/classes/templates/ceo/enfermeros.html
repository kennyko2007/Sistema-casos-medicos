<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Enfermeros')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <th:block th:replace="~{layout/ceo-ui :: estilos}"></th:block>
    <div th:replace="~{layout/ceo-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title"><em>Enfermeros</em></h1>
                    <p class="adm-sub">Doctor asignado y horario del personal de enfermería.</p>
                </div>
                <a th:href="@{/ceo/dashboard}" class="adm-btn adm-btn-ghost adm-btn-sm">← Panel general</a>
            </div>

            <div class="adm-table-wrap" th:if="${not #lists.isEmpty(enfermeros)}">
                <table class="adm-table">
                    <thead>
                        <tr><th>Enfermero/a</th><th>Doctor asignado</th><th>Teléfono</th><th>Horario</th><th>CV</th><th>Estado</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${enfermeros}" th:with="hs=${horarios[e['id_usuario']]}"
                            th:classappend="${e['activo']} ? '' : 'inactivo'">
                            <td><strong th:text="${e['nombre_completo']}">Nombre</strong></td>
                            <td th:text="${#strings.isEmpty(e['doctor_asignado']) ? 'Sin asignar' : e['doctor_asignado']}">Dr. Nombre</td>
                            <td th:text="${#strings.isEmpty(e['telefono']) ? '—' : e['telefono']}">Teléfono</td>
                            <td>
                                <div th:each="h : ${hs}" th:text="|${h['dia_semana']}: ${h['hora_inicio']} – ${h['hora_fin']}|">Lunes: 08:00 – 14:00</div>
                                <span th:if="${#lists.isEmpty(hs)}" class="adm-hint">Sin horario</span>
                            </td>
                                                        <td>
                                <a th:if="${e['cv_pdf_ruta'] != null}" th:href="@{/documentos/cv/{id}(id=${e['id_usuario']})}"
                                   target="_blank" rel="noopener" class="adm-btn adm-btn-sm adm-btn-ghost">Ver CV</a>
                                <span th:unless="${e['cv_pdf_ruta'] != null}" class="adm-pill">Sin CV cargado</span>
                            </td>
                            <td>
                                <span th:if="${e['activo']}" class="adm-pill adm-pill-ok">Activo</span>
                                <span th:unless="${e['activo']}" class="adm-pill adm-pill-warn">Deshabilitado</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(enfermeros)}" class="adm-hint" style="margin:0">No hay enfermeros registrados.</p>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
