<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Asistencia del personal')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <th:block th:replace="~{layout/ceo-ui :: estilos}"></th:block>
    <div th:replace="~{layout/ceo-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title">Asistencia <em>en vivo</em></h1>
                    <p class="adm-sub">
                        <span th:text="${hoyTexto}">lunes 9 de noviembre</span> ·
                        <small id="asist-ultima" class="adm-hint">Actualizando…</small>
                    </p>
                </div>
                <a th:href="@{/ceo/dashboard}" class="adm-btn adm-btn-ghost adm-btn-sm">← Panel general</a>
            </div>

            <div class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr><th>Nombre</th><th>Rol</th><th>Horario de hoy</th><th>Estado</th><th>Hora</th><th>Observación</th></tr>
                    </thead>
                    <tbody id="asist-body" th:attr="data-url=@{/ceo/asistencia/datos}">
                        <tr th:each="a : ${asistenciaHoy}">
                            <td th:text="${a['nombre']}">Nombre</td>
                            <td th:text="${a['rol'] == 'doctor'} ? 'Doctor' : 'Enfermero/a'">Rol</td>
                            <td th:text="${a['hora_inicio'] != null} ? |${a['hora_inicio']} – ${a['hora_fin']}| : 'Sin horario hoy'">08:00 – 14:00</td>
                            <td>
                                <span class="adm-pill" th:text="${a['estado']}"
                                      th:classappend="${a['estado'] == 'Presente'} ? 'adm-pill-ok' : (${a['estado'] == 'Sin marcar'} ? '' : 'adm-pill-warn')">Estado</span>
                            </td>
                            <td th:text="${a['hora'] != null} ? ${a['hora']} : '—'">08:05</td>
                            <td th:text="${#strings.isEmpty(a['observacion']) ? '—' : a['observacion']}">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(asistenciaHoy)}" class="adm-hint" style="margin:0">No hay personal activo registrado.</p>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script>
        (function () {
            var cuerpo = document.getElementById('asist-body');
            var ultima = document.getElementById('asist-ultima');
            var url = cuerpo.dataset.url;

            function celda(contenido) {
                var td = document.createElement('td');
                if (typeof contenido === 'string') { td.textContent = contenido; }
                else { td.appendChild(contenido); }
                return td;
            }

            function pill(estado) {
                var s = document.createElement('span');
                s.className = 'adm-pill' + (estado === 'Presente' ? ' adm-pill-ok'
                            : (estado === 'Sin marcar' ? '' : ' adm-pill-warn'));
                s.textContent = estado;
                return s;
            }

            function pintar(filas) {
                cuerpo.textContent = '';
                filas.forEach(function (a) {
                    var tr = document.createElement('tr');
                    tr.appendChild(celda(a.nombre || ''));
                    tr.appendChild(celda(a.rol === 'doctor' ? 'Doctor' : 'Enfermero/a'));
                    tr.appendChild(celda(a.hora_inicio ? a.hora_inicio + ' – ' + a.hora_fin : 'Sin horario hoy'));
                    tr.appendChild(celda(pill(a.estado || 'Sin marcar')));
                    tr.appendChild(celda(a.hora || '—'));
                    tr.appendChild(celda(a.observacion || '—'));
                    cuerpo.appendChild(tr);
                });
                ultima.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-BO');
            }

            function cargar() {
                if (document.hidden) { return; }       // no consulta si la pestaña está oculta
                fetch(url, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
                    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
                    .then(pintar)
                    .catch(function () { ultima.textContent = 'Sin conexión, reintentando…'; });
            }

            setInterval(cargar, 5000);
            cargar();
        })();
    </script>
</body>
</html>
