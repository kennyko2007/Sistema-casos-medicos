<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Histórico de pacientes')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <th:block th:replace="~{layout/medico-ui :: estilos}"></th:block>
    <div th:replace="~{layout/medico-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title">Histórico de <em>pacientes</em></h1>
                    <p class="adm-sub">Pacientes que has atendido, <strong th:text="${doctor?.nombre_completo}">Dr. Nombre</strong>.</p>
                </div>
                <div class="adm-field" style="min-width:260px">
                    <label class="adm-label" for="filtro">Buscar</label>
                    <input id="filtro" type="search" class="adm-input" placeholder="Paciente, caso o especialidad">
                </div>
            </div>

            <div th:if="${error}" class="adm-msg adm-msg-error" th:text="${error}">Mensaje</div>

            <div class="adm-table-wrap">
                <table class="adm-table" id="tablaHistorico">
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Caso</th>
                            <th>Especialidad</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Recomendación</th>
                            <th>PDF</th>
                            <th>Chat</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${historico}">
                            <td th:text="${h.nombre_paciente}">Paciente</td>
                            <td th:text="${h.titulo_caso}">Caso</td>
                            <td th:text="${h.especialidad}">Cardiología</td>
                            <td>
                                <span class="adm-pill" th:text="${h.estado}"
                                      th:classappend="${h.estado == 'Concluido'} ? 'adm-pill-ok' : (${h.estado == 'Pendiente'} ? 'adm-pill-warn' : '')">En Tratamiento</span>
                            </td>
                            <td th:text="${h.fecha_atencion}">2026-11-08</td>
                            <td th:text="${h.recomendacion}">Sin recomendaciones</td>
                            <td>
                                <a th:if="${h.pdf_ruta != null}" th:href="@{/documentos/atencion/{id}(id=${h.id_atencion})}"
                                   target="_blank" rel="noopener" class="adm-btn adm-btn-sm adm-btn-ghost">Ver PDF</a>
                                <span th:unless="${h.pdf_ruta != null}" class="adm-pill">Pendiente</span>
                            </td>
                            <td>
                                <a th:href="@{/medico/chat/{id}(id=${h.id_caso})}" class="adm-btn adm-btn-sm adm-btn-ghost">Abrir chat</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(historico)}">
                            <td colspan="8" class="vacio">Aún no hay pacientes en tu histórico.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script>
        (function () {
            var filtro = document.getElementById('filtro');
            var filas = document.querySelectorAll('#tablaHistorico tbody tr');
            filtro.addEventListener('input', function () {
                var q = filtro.value.trim().toLowerCase();
                filas.forEach(function (f) {
                    f.style.display = f.textContent.toLowerCase().indexOf(q) === -1 ? 'none' : '';
                });
            });
        })();
    </script>
</body>
</html>
