<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="estilos">
<style>
    /* ===== Fondo global: la imagen cubre TODA la pantalla ===== */
    html { background: #0b1b33; }
    body {
        background: transparent;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .adm-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #0b1b33;
        background-image: var(--hero-image, none);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    /* Velo suave: sube/baja 0.35 para oscurecer más o menos la imagen */
    .adm-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(11, 27, 51, 0.35);
    }

    /* ===== Marca inferior: centrada, con color y más peso ===== */
    footer {
        flex: 1 0 auto;                 /* ocupa el espacio libre bajo la tarjeta */
        min-height: 130px;
        display: flex !important;
        align-items: center;            /* centrado vertical */
        justify-content: center;        /* centrado horizontal */
        gap: .7em;
        padding: 1rem 1rem 2rem !important;
        background: transparent !important;
        border: 0 !important;
        opacity: 1 !important;
        font-size: 0 !important;        /* oculta el texto original del footer */
        line-height: 1;
    }
    footer * { display: none !important; }

    footer::before,
    footer::after {
        font-family: 'Jost', system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(11, 27, 51, 0.95), 0 0 14px rgba(11, 27, 51, 0.85);
    }
    /* Parte dorada: marca + puntito */
    footer::before {
        content: "LuxeHealth ·";
        color: #e3b94a;
    }
    /* Parte blanca; el margen negativo compensa el espacio final del letter-spacing */
    footer::after {
        content: "Sistema de gestión hospitalaria";
        color: #ffffff;
        margin-right: -.14em;
    }

    /* ===== Tarjeta al frente ===== */
    .adm-wrap { max-width: 1200px; width: 100%; box-sizing: border-box; margin: 8rem auto 2rem; padding: 0 1rem; position: relative; z-index: 10; font-family: 'Jost', system-ui, sans-serif; color: #0f2340; }
    .adm-wrap.estrecho { max-width: 760px; }
    .adm-card { background: #fff; border-radius: 20px; padding: 2rem; box-shadow: 0 20px 40px rgba(15, 35, 64, 0.28); }
    .adm-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.2rem; line-height: 1.1; margin: 0 0 .35rem; text-transform: uppercase; letter-spacing: .02em; }
    .adm-title em { font-style: normal; color: #c9a227; }
    .adm-sub { color: #5b6b82; margin: 0 0 1.5rem; }

    .adm-msg { padding: .75rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: .92rem; }
    .adm-msg-ok { background: #e7f6ef; color: #0b6b46; border: 1px solid #b7e3cf; }
    .adm-msg-error { background: #fdecef; color: #b4132f; border: 1px solid #f5c2cb; }

    .adm-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .adm-grid2 { grid-template-columns: 1fr; } }

    .adm-field { margin-bottom: 1rem; }
    .adm-label { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #1570c2; margin-bottom: .35rem; font-weight: 600; }
    .adm-input { width: 100%; box-sizing: border-box; padding: .7rem .85rem; border: 1px solid #d5dde8; border-radius: 10px; font: inherit; background: #fff; color: #0f2340; }
    .adm-input:focus { outline: 2px solid #1570c2; border-color: transparent; }
    .adm-input[disabled] { background: #f3f6fa; color: #5b6b82; }
    textarea.adm-input { min-height: 96px; resize: vertical; }
    .adm-hint { font-size: .8rem; color: #5b6b82; margin-top: .3rem; }

    .adm-checks { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; }
    .adm-checks label { display: inline-flex; align-items: center; gap: .4rem; font-size: .95rem; }

    .adm-btn { display: inline-block; border: 0; border-radius: 10px; padding: .7rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; background: #1570c2; color: #fff; }
    .adm-btn:hover { filter: brightness(1.08); }
    .adm-btn-block { width: 100%; margin-top: .5rem; }
    .adm-btn-sm { padding: .35rem .7rem; font-size: .8rem; border-radius: 8px; }
    .adm-btn-ghost { background: #eef3f9; color: #0f2340; }
    .adm-btn-danger { background: #c0233f; }
    .adm-btn-ok { background: #0b8a5a; }
    .adm-btn-warn { background: #c98a0a; }
    .adm-btn-gris { background: #6b7a90; }

    .adm-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
    .adm-tab { padding: .4rem .95rem; border-radius: 999px; background: #eef3f9; color: #0f2340; text-decoration: none; font-size: .85rem; }
    .adm-tab.activo { background: #0f2340; color: #fff; }

    .adm-table-wrap { overflow-x: auto; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .adm-table th { text-align: left; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: #5b6b82; padding: .6rem .75rem; border-bottom: 2px solid #e3e9f1; white-space: nowrap; }
    .adm-table td { padding: .7rem .75rem; border-bottom: 1px solid #edf1f6; vertical-align: middle; }
    .adm-table tr.inactivo td { opacity: .55; }
    .adm-table .vacio { text-align: center; color: #5b6b82; padding: 2rem; }
    .adm-cap { text-transform: capitalize; }

    .adm-pill { display: inline-block; padding: .15rem .65rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: #eef3f9; color: #33465f; white-space: nowrap; }
    .adm-pill-ok { background: #e7f6ef; color: #0b6b46; }
    .adm-pill-warn { background: #fdf3dc; color: #8a5a00; }
    .adm-pill-bad { background: #fdecef; color: #b4132f; }

    .adm-acciones { display: flex; flex-wrap: wrap; gap: .4rem; }
    .adm-rowform { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    .adm-rowform .adm-input { width: 200px; padding: .4rem .6rem; font-size: .85rem; }
    .adm-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
</style>
</th:block>

<!-- Solo el fondo fijo a pantalla completa -->
<div th:fragment="heroAdmin">
    <div class="adm-bg" th:style="'--hero-image: url(' + @{/images/INTERFAZADMIN.png} + ')'"></div>
</div>

</body>
</html>
