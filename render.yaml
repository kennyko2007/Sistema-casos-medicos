services:
  - type: web
    name: sistema-casos-medicos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        sync: false          # ej: jdbc:mysql://HOST:3306/BASE?useSSL=true&serverTimezone=America/La_Paz
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/uploads   # temporal: los CV viven en la base de datos
