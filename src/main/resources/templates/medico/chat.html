<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Chat con pacientes')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <th:block th:replace="~{layout/medico-ui :: estilos}"></th:block>
    <div th:replace="~{layout/medico-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <h1 class="adm-title">Chat con <em>pacientes</em></h1>
            <p class="adm-sub">Una conversación por caso clínico.</p>

            <div th:if="${error}" class="adm-msg adm-msg-error" th:text="${error}">Mensaje</div>

            <div class="med-grid">

                <!-- Conversaciones -->
                <aside>
                    <ul class="med-lista">
                        <li th:each="c : ${conversaciones}">
                            <a th:href="@{/medico/chat/{id}(id=${c.id_caso})}" class="med-item"
                               th:classappend="${caso != null and caso.id == c.id_caso} ? 'activo'">
                                <span>
                                    <span th:text="${c.nombre_paciente}">Paciente</span>
                                    <span th:if="${c.no_leidos > 0}" class="adm-pill adm-pill-warn" th:text="${c.no_leidos}">1</span>
                                </span>
                                <small th:text="${c.titulo_caso}">Caso</small>
                                <small th:text="${c.ultimo_mensaje != null} ? ${#strings.abbreviate(c.ultimo_mensaje, 40)} : 'Sin mensajes'">Último mensaje</small>
                            </a>
                        </li>
                        <li th:if="${#lists.isEmpty(conversaciones)}" class="adm-hint">No tienes conversaciones.</li>
                    </ul>
                </aside>

                <!-- Ventana de chat -->
                <div>
                    <div th:if="${caso == null}" class="med-box">
                        <p class="adm-hint" style="margin:0">Selecciona una conversación para ver los mensajes.</p>
                    </div>

                    <div th:if="${caso != null}" class="med-chat">
                        <div class="med-chat-head">
                            <span th:text="${caso.nombre_paciente}">Paciente</span>
                            <small th:text="${caso.titulo_caso}">Caso</small>
                        </div>

                        <!-- data-caso y data-yo los lee chat-vivo.js para conectar el WebSocket -->
                        <div class="med-chat-msgs" id="mensajes" th:attr="data-caso=${caso.id},data-yo='doctor'">
                            <div th:each="m : ${mensajes}" class="burbuja"
                                 th:classappend="${m.remitente == 'doctor'} ? 'burbuja-mia' : 'burbuja-otro'">
                                <span th:text="${m.mensaje}">Mensaje</span>
                                <time th:text="${m.fecha_envio}">2026-11-08 08:10</time>
                            </div>
                            <p th:if="${#lists.isEmpty(mensajes)}" class="adm-hint" style="text-align:center">Aún no hay mensajes en este caso.</p>
                        </div>

                        <form th:action="@{/medico/chat/enviar}" method="post" class="med-chat-form" autocomplete="off">
                            <input type="hidden" name="idCaso" th:value="${caso.id}">
                            <input type="text" name="mensaje" class="adm-input" required maxlength="1000" placeholder="Escribe un mensaje…">
                            <button type="submit" class="adm-btn">Enviar</button>
                        </form>
                        <small id="chat-estado" class="adm-hint"></small>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/js/chat-vivo.js}"></script>
</body>
</html>
