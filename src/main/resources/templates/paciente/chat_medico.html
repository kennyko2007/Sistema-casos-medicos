<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: headPanel('Chat con mi doctor')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <div th:replace="~{layout/paciente-ui :: fondo}"></div>

    <main class="adm-wrap estrecho">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title">Chat con mi <em>doctor</em></h1>
                    <p class="adm-sub">Tus mensajes llegan directamente al doctor que atiende este caso.</p>
                </div>
                <a th:href="@{/paciente/portal}" class="adm-btn adm-btn-ghost adm-btn-sm">← Volver a mi portal</a>
            </div>

            <div class="med-chat">
                <div class="med-chat-head">
                    <div class="med-chat-quien">
                        <span th:text="${caso.nombre_doctor}">Dr. Nombre</span>
                        <small th:text="|${caso.titulo_caso} · ${caso.estado}|">Caso · Estado</small>
                    </div>
                    <div class="med-chat-estado">
                        <span class="med-chat-typing" id="chat-escribiendo" hidden>
                            <span class="puntos" aria-hidden="true"><i></i><i></i><i></i></span> Escribiendo…
                        </span>
                        <button type="button" class="med-chat-sonido" data-sonido-toggle aria-pressed="true">Sonido: sí</button>
                    </div>
                </div>

                <div class="med-chat-msgs" id="mensajes" th:attr="data-caso=${caso.id},data-yo='paciente'">
                    <div th:each="m : ${mensajes}" class="burbuja"
                         th:classappend="${m.remitente == 'paciente'} ? 'burbuja-mia' : 'burbuja-otro'">
                        <span th:text="${m.mensaje}">Mensaje</span>
                        <time th:text="${m.fecha_envio}">2026-11-08 08:10</time>
                    </div>
                    <p th:if="${#lists.isEmpty(mensajes)}" class="adm-hint" style="text-align:center">Aún no hay mensajes. Escribe el primero.</p>
                </div>

                <form th:action="@{/paciente/chat/enviar}" method="post" class="med-chat-form" autocomplete="off">
                    <input type="hidden" name="idCaso" th:value="${caso.id}">
                    <input type="text" name="mensaje" class="adm-input" required maxlength="1000" placeholder="Escribe un mensaje…">
                    <button type="submit" class="adm-btn">Enviar</button>
                </form>
                <small id="chat-estado" class="adm-hint"></small>
            </div>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/js/chat-vivo.js(v='20261115c')}"></script>
</body>
</html>
