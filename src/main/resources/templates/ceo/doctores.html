<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Doctores')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <th:block th:replace="~{layout/ceo-ui :: estilos}"></th:block>
    <div th:replace="~{layout/ceo-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title"><em>Doctores</em></h1>
                    <p class="adm-sub">Especialidades, hoja de vida y horario de cada doctor.</p>
                </div>
                <a th:href="@{/ceo/dashboard}" class="adm-btn adm-btn-ghost adm-btn-sm">← Panel general</a>
            </div>

            <div class="adm-table-wrap" th:if="${not #lists.isEmpty(doctores)}">
                <table class="adm-table">
                    <thead>
                        <tr><th>Doctor</th><th>Especialidades</th><th>Teléfono</th><th>Hoja de vida</th><th>Horario</th><th>Estado</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${doctores}" th:with="hs=${horarios[d['id_usuario']]}"
                            th:classappend="${d['activo']} ? '' : 'inactivo'">
                            <td>
                                <strong th:text="${d['nombre_completo']}">Dr. Nombre</strong>
                                <div th:if="${not #strings.isEmpty(d['cv_resumen'])}"><small th:text="${d['cv_resumen']}">Resumen</small></div>
                            </td>
                            <td th:text="${#strings.isEmpty(d['especialidades']) ? 'Sin especialidades' : d['especialidades']}">Cardiología</td>
                            <td th:text="${#strings.isEmpty(d['telefono']) ? '—' : d['telefono']}">Teléfono</td>
                            <td>
                                <span th:if="${d['cv_pdf_ruta'] != null}" class="adm-pill adm-pill-ok">CV disponible</span>
                                <span th:unless="${d['cv_pdf_ruta'] != null}" class="adm-pill">Sin CV cargado</span>
                            <a th:if="${d['cv_pdf_ruta'] != null}" th:href="@{/documentos/cv/{id}(id=${d['id_usuario']})}"
                                target="_blank" rel="noopener" class="adm-btn adm-btn-sm adm-btn-ghost">Ver CV</a>
                            </td>
                            <td>
                                <div th:each="h : ${hs}" th:text="|${h['dia_semana']}: ${h['hora_inicio']} – ${h['hora_fin']}|">Lunes: 08:00 – 14:00</div>
                                <span th:if="${#lists.isEmpty(hs)}" class="adm-hint">Sin horario</span>
                            </td>
                            <td>
                                <span th:if="${d['activo']}" class="adm-pill adm-pill-ok">Activo</span>
                                <span th:unless="${d['activo']}" class="adm-pill adm-pill-warn">Deshabilitado</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(doctores)}" class="adm-hint" style="margin:0">No hay doctores registrados.</p>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
