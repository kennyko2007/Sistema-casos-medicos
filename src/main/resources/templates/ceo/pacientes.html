<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: headPanel('Pacientes')}"></head>
<body>
    <header th:replace="~{layout/base :: navbar}"></header>

    <div th:replace="~{layout/ceo-ui :: fondo}"></div>

    <main class="adm-wrap">
        <section class="adm-card">
            <div class="adm-top">
                <div>
                    <h1 class="adm-title"><em>Pacientes</em></h1>
                    <p class="adm-sub">Todos los pacientes y la cantidad de casos de cada uno.</p>
                </div>
                <a th:href="@{/ceo/dashboard}" class="adm-btn adm-btn-ghost adm-btn-sm">← Panel general</a>
            </div>

            <div class="adm-table-wrap" th:if="${not #lists.isEmpty(pacientes)}">
                <table class="adm-table">
                    <thead>
                        <tr><th>Paciente</th><th>Nacimiento</th><th>Teléfono</th><th>Sangre</th><th>Casos</th><th>Estado</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pacientes}" th:classappend="${p['activo']} ? '' : 'inactivo'">
                            <td th:text="${p['nombre_completo']}">Nombre</td>
                            <td th:text="${p['fecha_nacimiento']}">2000-01-01</td>
                            <td th:text="${#strings.isEmpty(p['telefono']) ? '—' : p['telefono']}">Teléfono</td>
                            <td th:text="${#strings.isEmpty(p['tipo_sangre']) ? '—' : p['tipo_sangre']}">O+</td>
                            <td th:text="${p['total_casos']}">0</td>
                            <td>
                                <span th:if="${p['activo']}" class="adm-pill adm-pill-ok">Activo</span>
                                <span th:unless="${p['activo']}" class="adm-pill adm-pill-warn">Deshabilitado</span>
                            </td>
                            <td><a th:href="@{/ceo/pacientes/{id}(id=${p['id']})}" class="adm-btn adm-btn-sm">Ver detalle</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(pacientes)}" class="adm-hint" style="margin:0">No hay pacientes registrados.</p>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
